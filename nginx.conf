server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Backend runs on the host (WSL) — reached via host.docker.internal (see docker-compose.yml),
    # so the address no longer breaks when the WSL IP changes.
    # Keep proxy_pass a literal (no variables): nginx then resolves the name at startup from
    # /etc/hosts, where extra_hosts puts it. Docker's DNS (used for variables) does not know it.

    location /api/ {
        proxy_pass http://host.docker.internal:8765;
        proxy_set_header Host $http_host;
        client_max_body_size 200m;
    }
    location /ws/ {
        proxy_pass http://host.docker.internal:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;  # keep the port so the backend's Origin check matches
        proxy_read_timeout 3600s;  # pipelines run for a long time
        proxy_send_timeout 3600s;
    }
    location /health { proxy_pass http://host.docker.internal:8765; }
    location / { try_files $uri $uri/ /index.html; }
}
