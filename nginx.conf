server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ { proxy_pass http://172.25.221.182:8765; proxy_set_header Host $host; }
    location /ws/  { proxy_pass http://172.25.221.182:8765; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
    location /health { proxy_pass http://172.25.221.182:8765; }
    location / { try_files $uri $uri/ /index.html; }
}
